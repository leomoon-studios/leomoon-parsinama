name: Android catalog and APK check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  ANDROID_NDK_VERSION: 26.1.10909125

jobs:
  compile:
    name: Android arm64 host catalog and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Qt host tools
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          setup-python: true

      - name: Save Qt host path
        run: echo "QT_HOST_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Build catalog with host tools
        run: |
          df -h .
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-host --target parsinama_catalog --parallel 2
          cmake --build build-host --target parsinama_icon_generator --parallel 2
          python3 -c 'import sqlite3; db = sqlite3.connect("file:build-host/parsinama-catalog.sqlite?mode=ro", uri=True); count = int(db.execute("SELECT value FROM metadata WHERE key = ?", ("poems_count",)).fetchone()[0]); assert count > 0, count; print(f"Host catalog contains {count} poems")'
          sha256sum build-host/parsinama-catalog.sqlite > "$RUNNER_TEMP/host-catalog.sha256"
          echo "HOST_CATALOG=$(realpath build-host/parsinama-catalog.sqlite)" >> "$GITHUB_ENV"
          echo "HOST_ICON_GENERATOR=$(realpath build-host/parsinama-icon-generator)" >> "$GITHUB_ENV"
          df -h .

      - name: Install Qt for Android arm64
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          setup-python: true

      - name: Install matching Android NDK
        run: |
          echo "QT_ANDROID_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION"

      - name: Configure Android app
        run: |
          "$QT_ANDROID_ROOT/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DQT_HOST_PATH="$QT_HOST_ROOT" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            -DPARSINAMA_HOST_CATALOG="$HOST_CATALOG" \
            -DPARSINAMA_HOST_ICON_GENERATOR="$HOST_ICON_GENERATOR" \
            -DBUILD_TESTING=OFF

      - name: Compile Android application
        run: |
          cmake --build build-android --target leomoon_parsinama --parallel 2

      - name: Check that desktop printing is absent
        run: |
          if rg -n 'libQt6(PrintSupport|Widgets)|src/services/PrintService.cpp' build-android/build.ninja; then
            echo "Android target unexpectedly depends on desktop printing" >&2
            exit 1
          fi

      - name: Verify Android consumed the host catalog
        run: |
          test "$(sed -n 's/^PARSINAMA_HOST_CATALOG:FILEPATH=//p' build-android/CMakeCache.txt)" = "$HOST_CATALOG"
          sha256sum --check "$RUNNER_TEMP/host-catalog.sha256"
          if rg -n 'parsinama-catalog-builder' build-android/build.ninja; then
            echo "Android build unexpectedly contains a target-architecture catalog builder" >&2
            exit 1
          fi

      - name: Build APK with offline catalog
        run: cmake --build build-android --target apk --parallel 2

      - name: Verify packaged catalog
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import zipfile

          apk = pathlib.Path('build-android/android-build/leomoon_parsinama.apk')
          assert apk.is_file(), apk
          expected = hashlib.file_digest(open('build-host/parsinama-catalog.sqlite', 'rb'), 'sha256').hexdigest()
          with zipfile.ZipFile(apk) as package:
              print(f'APK: {apk} ({apk.stat().st_size:,} bytes)')
              names = set(package.namelist())
              for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
                  assert f'res/mipmap-{density}-v4/ic_launcher.png' in names
              manifest = package.read('assets/parsinama-catalog.manifest').decode().split()
              assert manifest[0] == expected
              assert int(manifest[1]) == pathlib.Path('build-host/parsinama-catalog.sqlite').stat().st_size
              count = int(manifest[2])
              digest = hashlib.sha256()
              total = 0
              for index in range(count):
                  name = f'assets/parsinama-catalog-{index:04d}.part'
                  assert name in names, name
                  with package.open(name) as part:
                      while block := part.read(1024 * 1024):
                          digest.update(block)
                          total += len(block)
              assert total == int(manifest[1]), total
              assert digest.hexdigest() == expected
          print('APK catalog checksum matches host catalog')
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-step3-arm64-apk
          path: build-android/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Install Qt for Android x86_64 emulator
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_x86_64
          setup-python: true

      - name: Build emulator APK with the same catalog parts
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android-x86 -G Ninja \
            -DQT_HOST_PATH="$QT_HOST_ROOT" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            -DPARSINAMA_HOST_CATALOG="$HOST_CATALOG" \
            -DPARSINAMA_HOST_ICON_GENERATOR="$HOST_ICON_GENERATOR" \
            -DPARSINAMA_ANDROID_PARTS_DIR="$GITHUB_WORKSPACE/build-android/parsinama-android-catalog-parts" \
            -DBUILD_TESTING=OFF
          cmake --build build-android-x86 --target apk --parallel 2

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fresh install and relaunch offline
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 12G
          ram-size: 4096M
          emulator-boot-timeout: 600
          script: python3 scripts/android_offline_smoke.py build-android-x86/android-build/leomoon_parsinama.apk build-host/parsinama-catalog.sqlite
