name: Package test builds

on:
  workflow_dispatch:
    inputs:
      test_tag:
        description: Version tag to simulate for a manual package test
        required: false
        type: string
      target:
        description: Platform to build and test
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android
      arch:
        description: Linux and Windows architecture; macOS and Android use their fixed targets
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Generate version from tag
        id: version
        shell: bash
        env:
          PARSINAMA_VERSION_TAG: ${{ inputs.test_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.target }}" == android && "${{ inputs.arch }}" == x64 ]]; then
            echo "Android currently supports arm64 only; choose arch=arm64 or arch=all" >&2
            exit 1
          fi
          cmake -P cmake/GenerateVersion.cmake
          version="$(cat metadata/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    needs: validate
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      arch: ${{ github.event_name == 'push' && 'all' || inputs.arch }}

  windows:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    needs: validate
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      arch: ${{ github.event_name == 'push' && 'all' || inputs.arch }}

  macos:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    needs: validate
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  android:
    if: (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android') && (github.event_name == 'push' || inputs.arch == 'all' || inputs.arch == 'arm64')
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [validate, linux, windows, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download verified platform packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: leomoon-parsinama-*-${{ github.sha }}
          path: release-input

      - name: Collect individual release assets
        run: bash scripts/collect-release-assets.sh release-input release-assets "${{ needs.validate.outputs.version }}" "$GITHUB_SHA"

      - name: Generate release notes with commit list
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag=""
          while IFS= read -r candidate; do
            if git rev-parse -q --verify "refs/tags/$candidate^{commit}" >/dev/null \
              && git merge-base --is-ancestor "$candidate" "$GITHUB_REF_NAME^"; then
              previous_tag="$candidate"
              break
            fi
          done < <(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName')
          commit_range="$GITHUB_REF_NAME"
          if [[ -n "$previous_tag" ]]; then
            commit_range="$previous_tag..$GITHUB_REF_NAME"
          fi
          : > release-notes.md
          while IFS= read -r commit_hash; do
            subject="$(git show -s --format=%s "$commit_hash")"
            author_name="$(git show -s --format=%an "$commit_hash")"
            author_login="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit_hash" \
              --jq '.author.login // empty' 2>/dev/null || true)"
            if [[ -n "$author_login" ]]; then
              printf -- '- %s ([`%s`](https://github.com/%s/commit/%s)) by [%s](https://github.com/%s)\n' \
                "$subject" "${commit_hash:0:7}" "$GITHUB_REPOSITORY" "$commit_hash" \
                "$author_name" "$author_login" >> release-notes.md
            else
              printf -- '- %s ([`%s`](https://github.com/%s/commit/%s)) by %s\n' \
                "$subject" "${commit_hash:0:7}" "$GITHUB_REPOSITORY" "$commit_hash" \
                "$author_name" >> release-notes.md
            fi
          done < <(git rev-list "$commit_range")

      - name: Publish release and packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="LeoMoon ParsiNama $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > existing-draft.txt 2>/dev/null; then
            if [[ "$(cat existing-draft.txt)" != true ]]; then
              echo "Release $GITHUB_REF_NAME is already published"
              exit 0
            fi
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "$title" --notes-file release-notes.md
          fi
