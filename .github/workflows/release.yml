name: Package test builds

on:
  workflow_dispatch:
    inputs:
      test_tag:
        description: Version tag to simulate for a manual package test
        required: false
        type: string
      target:
        description: Platform to build and test
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android
      arch:
        description: Linux and Windows architecture; macOS and Android use their fixed targets
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Generate version from tag
        id: version
        shell: bash
        env:
          PARSINAMA_VERSION_TAG: ${{ inputs.test_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.target }}" == android && "${{ inputs.arch }}" == x64 ]]; then
            echo "Android currently supports arm64 only; choose arch=arm64 or arch=all" >&2
            exit 1
          fi
          cmake -P cmake/GenerateVersion.cmake
          version="$(cat metadata/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    needs: validate
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      arch: ${{ github.event_name == 'push' && 'all' || inputs.arch }}

  windows:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    needs: validate
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      arch: ${{ github.event_name == 'push' && 'all' || inputs.arch }}

  macos:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    needs: validate
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  android:
    if: (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android') && (github.event_name == 'push' || inputs.arch == 'all' || inputs.arch == 'arm64')
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.validate.outputs.version }}
