name: Linux package

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      arch:
        required: true
        type: string

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_QT_VERSION: 1-alpha-20250213-1
  APPIMAGE_RUNTIME_VERSION: "20251108"

jobs:
  build-test-package:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install build and smoke dependencies
        shell: bash
        run: |
          sudo apt-get update
          fuse_package=libfuse2
          if [[ "${{ matrix.arch }}" == arm64 ]]; then fuse_package=libfuse2t64; fi
          sudo apt-get install --yes build-essential cmake curl file "$fuse_package" \
            libgl1-mesa-dev libwayland-client0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            ninja-build xvfb

      - name: Install pinned Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.arch == 'arm64' && 'linux_arm64' || 'linux' }}
          target: desktop
          arch: ${{ matrix.arch == 'arm64' && 'linux_gcc_arm64' || 'linux_gcc_64' }}
          cache: true
          setup-python: true

      - name: Install pinned AppImage tools
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/parsinama-tools"
          mkdir -p "$tool_dir"
          appimage_arch=x86_64
          if [[ "${{ matrix.arch }}" == arm64 ]]; then appimage_arch=aarch64; fi
          if [[ "$appimage_arch" == aarch64 ]]; then
            linuxdeploy_sha256=620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
            qt_plugin_sha256=bf1c24aff6d749b5cf423afad6f15abd4440f81dec1aab95706b25f6667cdcf1
            runtime_sha256=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
          else
            linuxdeploy_sha256=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
            qt_plugin_sha256=15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724
            runtime_sha256=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          fi
          curl --fail --location --retry 3 --output "$tool_dir/linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-$appimage_arch.AppImage"
          curl --fail --location --retry 3 --output "$tool_dir/linuxdeploy-plugin-qt" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/$LINUXDEPLOY_QT_VERSION/linuxdeploy-plugin-qt-$appimage_arch.AppImage"
          curl --fail --location --retry 3 --output "$tool_dir/runtime-$appimage_arch" \
            "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-$appimage_arch"
          printf '%s  %s\n' "$linuxdeploy_sha256" "$tool_dir/linuxdeploy" \
            "$qt_plugin_sha256" "$tool_dir/linuxdeploy-plugin-qt" \
            "$runtime_sha256" "$tool_dir/runtime-$appimage_arch" | sha256sum --check
          chmod +x "$tool_dir/linuxdeploy" "$tool_dir/linuxdeploy-plugin-qt"
          echo "$tool_dir" >> "$GITHUB_PATH"
          echo "LDAI_RUNTIME_FILE=$tool_dir/runtime-$appimage_arch" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build app and catalog
        run: |
          cmake --build build-linux --parallel 2
          cmake --build build-linux --target parsinama_catalog --parallel 2
      - name: Test and lint
        run: |
          ctest --test-dir build-linux --output-on-failure --no-tests=error
          cmake --build build-linux --target leomoon_parsinama_qmllint
      - name: Package AppImage
        run: cmake --build build-linux --target package_appimage
      - name: Smoke test packaged app offline
        shell: bash
        run: |
          appimage="$(find build-linux/package/linux -maxdepth 1 -name 'leomoon-parsinama-*.AppImage' -print -quit)"
          test -n "$appimage"
          rm -rf build-linux/package/linux/AppDir
          scripts/smoke-linux-package.sh "$appimage"
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build-linux/package/linux/leomoon-parsinama-*.AppImage dist/
          (cd dist && sha256sum ./*.AppImage > SHA256SUMS)
          ls -lh dist/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leomoon-parsinama-linux-${{ matrix.arch }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
